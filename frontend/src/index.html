<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moodle</title>
  <!--
    Must stay absolute. With a relative base ("./") the browser resolves the JS/CSS
    bundles against the current directory, so any URL below the root (e.g. /take-quiz/1)
    requests /take-quiz/main-*.js. The SPA fallback answers that with index.html, the
    browser refuses to run HTML as a module script, and the page renders blank.
    The Cordova build that originally needed a relative base no longer exists.
  -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/d1053bafa2.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
