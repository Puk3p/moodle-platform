<div class="calendar-page">
  <div class="calendar-layout">

    <section class="calendar-main">
      <header class="calendar-header">
        <h1>Calendar</h1>

        <div class="view-toggle">
          <button 
            class="toggle-btn" 
            [class.active]="viewMode === 'month'"
            (click)="setView('month')">
            Month
          </button>
          <button 
            class="toggle-btn" 
            [class.active]="viewMode === 'week'"
            (click)="setView('week')">
            Week
          </button>
        </div>
      </header>
      
      <div class="calendar-card">
        <div class="calendar-card-header">
          <div class="month-nav">
            <button class="nav-btn" (click)="prev()">
              <fa-icon [icon]="faChevronLeft"></fa-icon>
            </button>

            <h2>{{ monthLabel }}</h2>

            <button class="nav-btn" (click)="next()">
              <fa-icon [icon]="faChevronRight"></fa-icon>
            </button>
          </div>

          <button class="today-btn" (click)="goToday()">
            Today
          </button>
        </div>

        <div class="weekdays">
          <div class="weekday" *ngFor="let w of weekdays">
            {{ w }}
          </div>
        </div>

        <div class="days-grid" [class.week-view]="viewMode === 'week'">
          <button
            type="button"
            class="day-cell"
            *ngFor="let day of days"
            [class.muted]="!day.inCurrentRange"
            [class.selected]="day.isoDate === selectedIso"
            [attr.aria-pressed]="day.isoDate === selectedIso"
            [attr.aria-label]="dayLabel(day)"
            (click)="selectDay(day)"
          >
            <span class="day-number">{{ day.dayNumber }}</span>

            <span
              class="today-dot"
              *ngIf="day.isToday"
            ></span>

            <!-- Wide: titled pills. Narrow (phone): one dot per event; the titles move
                 to the agenda under the grid. Switched by container query. -->
            <span
              class="events"
              *ngIf="getEventsForDay(day).length > 0"
            >
              <span
                class="event-pill"
                *ngFor="let event of getEventsForDay(day)"
                [title]="event.title"
              >
                {{ event.title }}
              </span>
            </span>

            <span class="event-dots" *ngIf="getEventsForDay(day).length > 0" aria-hidden="true">
              <span class="event-dot" *ngFor="let event of getEventsForDay(day).slice(0, 3)"></span>
            </span>
          </button>
        </div>

        <section class="day-agenda" *ngIf="selectedDay as day" aria-live="polite">
          <h3>{{ day.dateObj | date: 'EEEE, MMMM d' }}</h3>

          <ng-container *ngIf="getEventsForDay(day) as dayEvents">
            <p class="agenda-empty" *ngIf="dayEvents.length === 0">Nothing due this day.</p>

            <ul class="agenda-list" *ngIf="dayEvents.length > 0">
              <li class="agenda-item" *ngFor="let event of dayEvents">
                <span class="agenda-icon">
                  <fa-icon [icon]="getIconForType(event.type)"></fa-icon>
                </span>
                <span class="agenda-text">
                  <span class="title">{{ event.title }}</span>
                  <span class="meta">{{ event.courseCode }} · 11:59 PM</span>
                </span>
              </li>
            </ul>
          </ng-container>
        </section>
      </div>
    </section>

    <aside class="calendar-right">
      <section class="widget">
        <h2>Upcoming Deadlines</h2>

        <div class="widget-card">
          <p class="widget-empty" *ngIf="deadlines.length === 0">No upcoming deadlines.</p>

          <div
            class="deadline-item"
            *ngFor="let d of deadlines"
          >
            <div class="icon-box">
              <fa-icon [icon]="getIconForType(d.type)"></fa-icon>
            </div>

            <div class="deadline-info">
              <p class="title">{{ d.title }}</p>
              <p class="date">
                Due: {{ d.date }} · 11:59 PM
              </p>
              <p class="course">
                {{ d.courseCode }}
              </p>
            </div>
          </div>
        </div>
      </section>
    </aside>

  </div>
</div>
