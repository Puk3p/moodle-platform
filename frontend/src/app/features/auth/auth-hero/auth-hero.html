<svg viewBox="0 0 375 300" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="presentation" focusable="false">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c2500f"/>
      <stop offset="55%"  stop-color="#f07c38"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6ec" stop-opacity=".60"/>
      <stop offset="65%"  stop-color="#ffd9b8" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#ffd9b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="hero-sky" width="375" height="300" fill="url(#heroSky)"/>

  <!-- Orbits. Dashed so rotation is legible without adding contrast. -->
  <g fill="none" stroke="#ffffff">
    <circle class="hero-orbit hero-orbit--wide" cx="187.5" cy="150" r="132"
            stroke-opacity=".20" stroke-width="1" stroke-dasharray="3 9"/>
    <circle class="hero-orbit hero-orbit--mid"  cx="187.5" cy="150" r="100"
            stroke-opacity=".26" stroke-width="1" stroke-dasharray="2 7"/>
    <circle class="hero-orbit"                  cx="187.5" cy="150" r="70"
            stroke-opacity=".34" stroke-width="1"/>
  </g>

  <!-- Stars -->
  <g fill="#fff8ef">
    <circle class="hero-star"          cx="92"  cy="60"  r="2"/>
    <circle class="hero-star hero-star--2" cx="287" cy="78"  r="1.7"/>
    <circle class="hero-star hero-star--3" cx="118" cy="196" r="1.6"/>
    <circle class="hero-star hero-star--4" cx="305" cy="168" r="2"/>
    <circle class="hero-star hero-star--2" cx="207" cy="44"  r="1.4"/>
    <circle class="hero-star hero-star--3" cx="60"  cy="132" r="1.5"/>
  </g>

  <!-- Central halo + crest -->
  <circle class="hero-halo" cx="187.5" cy="150" r="76" fill="url(#heroGlow)"/>
  <circle cx="187.5" cy="150" r="46" fill="#ffffff" fill-opacity=".07"
          stroke="#ffffff" stroke-opacity=".34" stroke-width="1.5"/>

  <g class="hero-crest" fill="#ffffff">
    <path d="M187.5 129 L216 141 L187.5 153 L159 141 Z"/>
    <path d="M168 147.5 L168 160 C168 160 176 166 187.5 166 C199 166 207 160 207 160 L207 147.5 L187.5 155.6 Z"
          fill-opacity=".9"/>
    <path d="M214 142.6 L214 157" stroke="#ffffff" stroke-width="2.1"
          stroke-linecap="round" fill="none"/>
  </g>

  <!-- Subject badges riding the orbits -->
  <g transform="translate(110 92)">
    <g class="hero-badge">
      <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
      <g fill="none" stroke="#fff8ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-4.5 1.5a5.5 5.5 0 1 1 9 0c-1 1.4-1.6 2.3-1.8 4h-5.4c-.2-1.7-.8-2.6-1.8-4Z"/>
        <path d="M-2.6 9h5.2"/>
      </g>
    </g>
  </g>

  <g transform="translate(268 84)">
    <g class="hero-badge hero-badge--b">
      <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
      <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
        <circle cx="0" cy="0" r="6"/>
        <ellipse cx="0" cy="0" rx="11" ry="4.4" transform="rotate(-24)"/>
      </g>
    </g>
  </g>

  <g transform="translate(300 218)">
    <g class="hero-badge hero-badge--c">
      <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
      <g fill="none" stroke="#fff0e2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-1 6c-4-2-5-7-3.5-10.5C-3 -8 0 -9.5 0 -9.5s3 1.5 4.5 5C6 -1 5 4 1 6Z"/>
        <path d="M-2.5 6.5 -4.5 10M2.5 6.5 4.5 10"/>
        <circle cx="0" cy="-3.5" r="1.9"/>
      </g>
    </g>
  </g>

  <g transform="translate(74 206)">
    <g class="hero-badge hero-badge--d">
      <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
      <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-6.5" y="-8.5" width="13" height="17" rx="2.2"/>
        <path d="M-3.6 -4.6h7.2M-3.6 0h2M-1 0h.1M2 0h1.6M-3.6 4.2h2M2 4.2h1.6"/>
      </g>
    </g>
  </g>

  <g transform="translate(196 246)">
    <g class="hero-badge hero-badge--e">
      <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
      <g fill="none" stroke="#fff6ea" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-9 -6.5h6.6c1.5 0 2.4.7 2.4 2v11c0-1-.9-1.7-2.4-1.7H-9Z"/>
        <path d="M9 -6.5H2.4C.9 -6.5 0 -5.8 0 -4.5v11c0-1 .9-1.7 2.4-1.7H9Z"/>
      </g>
    </g>
  </g>
</svg>
