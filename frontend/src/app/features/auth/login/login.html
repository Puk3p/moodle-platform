<div class="auth-container">
 
  <div class="brand-header">
    <div class="logo-box">
      <span class="material-symbols-outlined">school</span>
    </div>
    <h1>Moodle V2</h1>
  </div>

  <div class="auth-card">

    <!-- Phone-only hero. Decorative, so it is hidden from assistive tech: the
         heading and labels below already carry the meaning. -->
    <div class="auth-hero" aria-hidden="true">
      <svg viewBox="0 0 375 300" preserveAspectRatio="xMidYMid slice"
           xmlns="http://www.w3.org/2000/svg" role="presentation" focusable="false">
        <defs>
          <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#c2500f"/>
            <stop offset="55%"  stop-color="#f07c38"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </linearGradient>
          <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#fff6ec" stop-opacity=".60"/>
            <stop offset="65%"  stop-color="#ffd9b8" stop-opacity=".26"/>
            <stop offset="100%" stop-color="#ffd9b8" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <rect class="hero-sky" width="375" height="300" fill="url(#heroSky)"/>

        <!-- Orbits. Dashed so rotation is legible without adding contrast. -->
        <g fill="none" stroke="#ffffff">
          <circle class="hero-orbit hero-orbit--wide" cx="187.5" cy="150" r="132"
                  stroke-opacity=".20" stroke-width="1" stroke-dasharray="3 9"/>
          <circle class="hero-orbit hero-orbit--mid"  cx="187.5" cy="150" r="100"
                  stroke-opacity=".26" stroke-width="1" stroke-dasharray="2 7"/>
          <circle class="hero-orbit"                  cx="187.5" cy="150" r="70"
                  stroke-opacity=".34" stroke-width="1"/>
        </g>

        <!-- Stars -->
        <g fill="#fff8ef">
          <circle class="hero-star"          cx="92"  cy="60"  r="2"/>
          <circle class="hero-star hero-star--2" cx="287" cy="78"  r="1.7"/>
          <circle class="hero-star hero-star--3" cx="118" cy="196" r="1.6"/>
          <circle class="hero-star hero-star--4" cx="305" cy="168" r="2"/>
          <circle class="hero-star hero-star--2" cx="207" cy="44"  r="1.4"/>
          <circle class="hero-star hero-star--3" cx="60"  cy="132" r="1.5"/>
        </g>

        <!-- Central halo + crest -->
        <circle class="hero-halo" cx="187.5" cy="150" r="76" fill="url(#heroGlow)"/>
        <circle cx="187.5" cy="150" r="46" fill="#ffffff" fill-opacity=".07"
                stroke="#ffffff" stroke-opacity=".34" stroke-width="1.5"/>

        <g class="hero-crest" fill="#ffffff">
          <path d="M187.5 129 L216 141 L187.5 153 L159 141 Z"/>
          <path d="M168 147.5 L168 160 C168 160 176 166 187.5 166 C199 166 207 160 207 160 L207 147.5 L187.5 155.6 Z"
                fill-opacity=".9"/>
          <path d="M214 142.6 L214 157" stroke="#ffffff" stroke-width="2.1"
                stroke-linecap="round" fill="none"/>
        </g>

        <!-- Subject badges riding the orbits -->
        <g transform="translate(110 92)">
          <g class="hero-badge">
            <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
            <g fill="none" stroke="#fff8ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-4.5 1.5a5.5 5.5 0 1 1 9 0c-1 1.4-1.6 2.3-1.8 4h-5.4c-.2-1.7-.8-2.6-1.8-4Z"/>
              <path d="M-2.6 9h5.2"/>
            </g>
          </g>
        </g>

        <g transform="translate(268 84)">
          <g class="hero-badge hero-badge--b">
            <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
            <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
              <circle cx="0" cy="0" r="6"/>
              <ellipse cx="0" cy="0" rx="11" ry="4.4" transform="rotate(-24)"/>
            </g>
          </g>
        </g>

        <g transform="translate(300 218)">
          <g class="hero-badge hero-badge--c">
            <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
            <g fill="none" stroke="#fff0e2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-1 6c-4-2-5-7-3.5-10.5C-3 -8 0 -9.5 0 -9.5s3 1.5 4.5 5C6 -1 5 4 1 6Z"/>
              <path d="M-2.5 6.5 -4.5 10M2.5 6.5 4.5 10"/>
              <circle cx="0" cy="-3.5" r="1.9"/>
            </g>
          </g>
        </g>

        <g transform="translate(74 206)">
          <g class="hero-badge hero-badge--d">
            <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
            <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="-6.5" y="-8.5" width="13" height="17" rx="2.2"/>
              <path d="M-3.6 -4.6h7.2M-3.6 0h2M-1 0h.1M2 0h1.6M-3.6 4.2h2M2 4.2h1.6"/>
            </g>
          </g>
        </g>

        <g transform="translate(196 246)">
          <g class="hero-badge hero-badge--e">
            <circle r="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
            <g fill="none" stroke="#fff6ea" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-9 -6.5h6.6c1.5 0 2.4.7 2.4 2v11c0-1-.9-1.7-2.4-1.7H-9Z"/>
              <path d="M9 -6.5H2.4C.9 -6.5 0 -5.8 0 -4.5v11c0-1 .9-1.7 2.4-1.7H9Z"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div class="auth-tabs" *ngIf="!requiresTwoFa">
      <button class="tab active">Login</button>
      <button class="tab" routerLink="/register">Register</button>
    </div>

    <div class="auth-body">
      
      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <ng-container *ngIf="!requiresTwoFa">
          <div class="text-center">
            <h2>Welcome Back</h2>
            <p class="subtitle">Access your CS labs, projects, and grades.</p>
          </div>

          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
            
            <label>
              <span class="label-text">Email Address</span>
              <div class="input-wrapper">
                <span class="material-symbols-outlined icon">mail</span>
                <input
                  type="email"
                  formControlName="email"
                  placeholder="student@university.edu"
                  [class.error]="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)"
                >
              </div>
              <span class="error-text" *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)">
                Valid email is required
              </span>
            </label>

            <label>
              <div class="label-row">
                <span class="label-text">Password</span>
                <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
              </div>
              <div class="input-wrapper">
                <span class="material-symbols-outlined icon">lock</span>
                <input
                  [type]="hidePassword ? 'password' : 'text'"
                  formControlName="password"
                  placeholder="Enter your password"
                  [class.error]="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched)"
                >
                <button type="button" class="toggle-pass" (click)="hidePassword = !hidePassword">
                    <span class="material-symbols-outlined">{{ hidePassword ? 'visibility_off' : 'visibility' }}</span>
                </button>
              </div>
              <span class="error-text" *ngIf="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched)">
                Password is too short
              </span>
            </label>

            <button type="submit" class="submit-btn" [class.loading]="isSubmitting" [disabled]="form.invalid || isSubmitting">
              <span *ngIf="!isSubmitting">Sign In</span>
              <span *ngIf="!isSubmitting" class="material-symbols-outlined arrow">arrow_forward</span>
              <span *ngIf="isSubmitting">Checking credentials...</span>
            </button>

          </form>

          <div class="divider">
            <span>OR</span>
          </div>

          <button type="button" class="google-btn" (click)="loginWithGoogle()">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
            </svg>
            Continue with Google
          </button>
      </ng-container>

      <ng-container *ngIf="requiresTwoFa">
          <div class="text-center">
            <h2>Two-Factor Authentication</h2>
            <p class="subtitle">Please enter the 6-digit code from your authenticator app.</p>
          </div>

          <div class="auth-form" style="margin-top: 1.5rem;">
            <label>
                <span class="label-text">Authenticator Code</span>
                <div class="input-wrapper">
                  <span class="material-symbols-outlined icon">security</span>
                  <input
                    type="text"
                    [formControl]="twoFaControl"
                    placeholder="123456"
                    maxlength="6"
                    style="letter-spacing: 0.2rem; font-weight: bold; text-align: center; padding-left: 1rem;"
                    [class.error]="twoFaControl.invalid && (twoFaControl.dirty || twoFaControl.touched)"
                  >
                </div>
            </label>

            <button type="button" class="submit-btn" [class.loading]="isSubmitting" (click)="onVerifyTwoFa()" [disabled]="twoFaControl.invalid || isSubmitting">
              <span *ngIf="!isSubmitting">Verify Code</span>
              <span *ngIf="!isSubmitting" class="material-symbols-outlined arrow">check</span>
              <span *ngIf="isSubmitting">Verifying...</span>
            </button>

            <button type="button" class="submit-btn" 
                    style="background: transparent; border: 1px solid #e5e7eb; color: #4b5563; margin-top: 0.5rem; box-shadow: none;" 
                    (click)="requiresTwoFa = false; errorMessage = null">
                Cancel
            </button>
          </div>
      </ng-container>

    </div>

    <div class="auth-footer" *ngIf="!requiresTwoFa">
      <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>

  </div>

  <p class="copyright">© 2025 Gheorghe Asachi Technical University of Iaşi.</p>

</div>
