name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Services ───────────────────────────────────────────
  # Each service is its own Spring Boot application. verify runs the module's formatting check
  # (Spotless), unit tests, integration tests (Testcontainers: MySQL and Kafka) and SpotBugs.
  services:
    name: "Services · ${{ matrix.module }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/academic-service
          - services/identity-service
          - services/assessment-service
          - services/progress-service
          - services/messaging-service
          - edge/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -ntp -f ${{ matrix.module }}/pom.xml verify

  # The whole platform in Docker Compose, driven through the gateway like the SPA.
  end-to-end:
    name: "Platform · End-to-end"
    runs-on: ubuntu-latest
    needs: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Start the stack
        run: docker compose -f deploy/compose.yml up -d --build --wait --wait-timeout 600
      - run: ./mvnw -B -ntp -f e2e/pom.xml verify -Pe2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail=300
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yml down -v

  # ─── Frontend ───────────────────────────────────────────
  frontend-lint:
    name: "Frontend · Lint & Typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  frontend-test:
    name: "Frontend · Unit Tests"
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  # ─── Branch name gate ──────────────────────────────────
  branch-name:
    name: "Branch Name Convention"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feature|bugfix|hotfix|chore|refactor|docs|test|release)\/[a-z0-9._-]+$"
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Branch name '$BRANCH' does not follow the convention."
            echo "Expected: <type>/<short-description>"
            echo "Types: feature, bugfix, hotfix, chore, refactor, docs, test, release"
            exit 1
          fi
          echo "✓ Branch name '$BRANCH' is valid."
