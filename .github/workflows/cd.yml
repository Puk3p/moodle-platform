name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-services:
    name: "Build Service JARs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # Tested by CI already; this only packages every service and the gateway.
      - run: ./mvnw -B -ntp package -DskipTests -Dspotless.check.skip=true -Dspotbugs.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            services/*/target/*.jar
            edge/gateway/target/*.jar

  release-frontend:
    name: "Build Frontend Dist"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  create-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [release-services, release-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/service-jars/**/*.jar
