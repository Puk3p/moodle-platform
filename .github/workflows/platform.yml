name: Platform

# The whole platform in Docker Compose, driven through the gateway like the SPA. Runs whenever a
# service, the deployment or the end-to-end suite changes.
on:
  push:
    branches: [main, develop]
    paths: ["services/**", "edge/**", "deploy/**", "e2e/**", ".github/workflows/platform.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["services/**", "edge/**", "deploy/**", "e2e/**", ".github/workflows/platform.yml"]

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: "End-to-end"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Start the stack
        run: docker compose -f deploy/compose.yml up -d --build --wait --wait-timeout 600
      - run: ./mvnw -B -ntp -f e2e/pom.xml verify -Pe2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail=300
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yml down -v
