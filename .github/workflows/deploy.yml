name: VPS Auto-Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: "Deploy Backend to VPS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          
      - name: Build JAR
        run: ./mvnw package -q -DskipTests

      - name: Upload JAR to VPS (Temp Location)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/target/*.jar"
          target: "/tmp/deploy-backend/"
          strip_components: 2

      - name: Configurare AWS, Permisiuni & Restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            # 1. Mută noul JAR la calea definită în ExecStart-ul din systemd
            mv /tmp/deploy-backend/*.jar /opt/moodle-platform/app.jar
            rm -rf /tmp/deploy-backend
            
            # 2. Descarcă secretele direct la locația EnvironmentFile
            aws ssm get-parameters-by-path \
              --path "/config/app/" \
              --with-decryption \
              --query "Parameters[*].[Name,Value]" \
              --output text | awk -F'\t' '{n=split($1,a,"/"); print a[n]"="$2}' > /opt/moodle-platform/.env
            
            # 3. Asigură-te că utilizatorul 'moodle' deține fișierele
            chown moodle:moodle /opt/moodle-platform/app.jar /opt/moodle-platform/.env
            
            # 4. Restartează aplicația
            systemctl restart moodle-backend.service
