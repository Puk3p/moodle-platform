name: VPS Auto-Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# The backend is NOT deployed from here for now. It became separate services (services/*,
# edge/gateway) run with Docker Compose, and the server still runs the previous single jar
# (systemd moodle-backend.service, port 8091), which keeps serving the API unchanged until the
# server is moved to the new platform. The frontend works with either backend.
jobs:
  deploy-frontend:
    name: "Deploy Frontend to VPS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Angular App
        run: |
          npm ci
          npx ng build --configuration production
          
      # Upload into a staging directory first. The webroot is NEVER emptied before the
      # new build has landed, so a failed or cancelled upload can no longer leave the
      # site serving nothing.
      - name: Upload to VPS (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/frontend/browser/*"
          target: "/var/www/moodle.puk3p.online.incoming/"
          strip_components: 4
          rm: true

      - name: Validate staged build, then publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            STAGE=/var/www/moodle.puk3p.online.incoming
            LIVE=/var/www/moodle.puk3p.online

            # Refuse to publish an incomplete upload.
            test -s "$STAGE/index.html" || { echo "staged index.html missing/empty; aborting"; exit 1; }
            grep -q "<app-root" "$STAGE/index.html" || { echo "staged index.html is not the Angular shell; aborting"; exit 1; }

            # Refuse to publish an INCONSISTENT upload: every local bundle index.html
            # points at must actually be present. Checking only that index.html exists
            # is not enough — a mismatched HTML/bundle pair serves a blank white page,
            # because the browser 404s on main-*.js and nothing boots.
            missing=0
            for f in $(grep -oE '(src|href)="[^"]*\.(js|css)"' "$STAGE/index.html" \
                       | sed 's/.*="//;s/"//' | grep -v '^https\?://'); do
              if [ ! -f "$STAGE/$f" ]; then
                echo "staged build references a missing asset: $f"
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || { echo "inconsistent build; refusing to publish"; exit 1; }
            echo "staged build is self-consistent"

            # Keep the previous release so a bad deploy can be rolled back by hand.
            rm -rf "${LIVE}.prev"
            cp -a "$LIVE" "${LIVE}.prev" 2>/dev/null || true

            rsync -a --delete "$STAGE/" "$LIVE/"
            chown -R www-data:www-data "$LIVE"
            rm -rf "$STAGE"

            # Fail the job if the site does not actually serve after publishing.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://moodle.puk3p.online/)
            echo "post-deploy frontend status: $code"
            test "$code" = "200"

            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://moodle.puk3p.online/api/courses)
            echo "post-deploy api status (401 expected when unauthenticated): $api"
            test "$api" = "401"
