name: VPS Auto-Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: "Deploy Backend to VPS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          
      - name: Build JAR
        run: ./mvnw package -q -DskipTests

      - name: Upload JAR to VPS (Temp Location)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/target/*.jar"
          target: "/tmp/deploy-backend/"
          strip_components: 2

      - name: Config AWS, Permissions & Restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Must match the region the SSM parameters actually live in (see --region below).
          AWS_DEFAULT_REGION: eu-north-1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            # 1. Mută noul JAR la calea definită în ExecStart-ul din systemd
            mv /tmp/deploy-backend/*.jar /opt/moodle-platform/app.jar
            rm -rf /tmp/deploy-backend
            
            # 2. Descarcă secretele direct la locația EnvironmentFile
            export AWS_SHARED_CREDENTIALS_FILE="/root/.aws/credentials"
            export AWS_CONFIG_FILE="/root/.aws/config"
            /usr/local/bin/aws ssm get-parameters-by-path \
              --region eu-north-1 \
              --path "/config/app/" \
              --with-decryption \
              --query "Parameters[*].[Name,Value]" \
              --output text | awk -F'\t' '{n=split($1,a,"/"); print a[n]"="$2}' > /opt/moodle-platform/.env
            
            # 3. Asigură-te că utilizatorul 'moodle' deține fișierele
            chown moodle:moodle /opt/moodle-platform/app.jar /opt/moodle-platform/.env
            
            # 4. Restartează aplicația
            systemctl restart moodle-backend.service

            # 5. Verifică că a repornit — altfel deploy-ul trece "verde" cu aplicația căzută.
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 http://127.0.0.1:8091/actuator/health | grep -q '"status":"UP"'; then
                echo "backend healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 3
            done
            echo "backend did not become healthy within 60s"
            systemctl status moodle-backend.service --no-pager -n 30 || true
            journalctl -u moodle-backend.service -n 50 --no-pager || true
            exit 1

  deploy-frontend:
    name: "Deploy Frontend to VPS"
    runs-on: ubuntu-latest
    # Publish the frontend only after the backend is up, so the new SPA is never
    # served against an API that is still restarting.
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Angular App
        run: |
          npm ci
          npx ng build --configuration production
          
      # Upload into a staging directory first. The webroot is NEVER emptied before the
      # new build has landed, so a failed or cancelled upload can no longer leave the
      # site serving nothing.
      - name: Upload to VPS (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/frontend/browser/*"
          target: "/var/www/moodle.puk3p.online.incoming/"
          strip_components: 4
          rm: true

      - name: Validate staged build, then publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            STAGE=/var/www/moodle.puk3p.online.incoming
            LIVE=/var/www/moodle.puk3p.online

            # Refuse to publish an incomplete upload.
            test -s "$STAGE/index.html" || { echo "staged index.html missing/empty; aborting"; exit 1; }
            grep -q "<app-root" "$STAGE/index.html" || { echo "staged index.html is not the Angular shell; aborting"; exit 1; }

            # Keep the previous release so a bad deploy can be rolled back by hand.
            rm -rf "${LIVE}.prev"
            cp -a "$LIVE" "${LIVE}.prev" 2>/dev/null || true

            rsync -a --delete "$STAGE/" "$LIVE/"
            chown -R www-data:www-data "$LIVE"
            rm -rf "$STAGE"

            # Fail the job if the site does not actually serve after publishing.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://moodle.puk3p.online/)
            echo "post-deploy frontend status: $code"
            test "$code" = "200"

            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://moodle.puk3p.online/api/courses)
            echo "post-deploy api status (401 expected when unauthenticated): $api"
            test "$api" = "401"
