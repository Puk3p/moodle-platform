name: progress-service

on:
  push:
    branches: [main, develop]
    paths:
      - "services/progress-service/**"
      - ".github/workflows/progress-service.yml"
      - ".github/workflows/service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/progress-service/**"
      - ".github/workflows/progress-service.yml"
      - ".github/workflows/service.yml"

concurrency:
  group: progress-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progress-service:
    uses: ./.github/workflows/service.yml
    with:
      path: services/progress-service
