# The platform on one host: every service is its own container, only the gateway is published.
#
#   docker compose -f deploy/compose.yml up -d --build
#   open http://localhost:8080        (the API; the SPA dev server proxies to it)
#
# Defaults below are for local development only. Override them in deploy/.env (see .env.example).
name: moodle

x-java: &java
  restart: unless-stopped
  environment: &java-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-academic-dev}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity-dev}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:-messaging-dev}
      PROGRESS_DB_PASSWORD: ${PROGRESS_DB_PASSWORD:-progress-dev}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessment-dev}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Published for local tooling and the end-to-end tests only; drop this in production.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-dev}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates any missing database or account on every start (a new service on an old volume).
  db-init:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-academic-dev}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity-dev}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:-messaging-dev}
      PROGRESS_DB_PASSWORD: ${PROGRESS_DB_PASSWORD:-progress-dev}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessment-dev}
    volumes:
      - ./mysql/init:/init:ro
    entrypoint: ["bash", "/init/01-databases.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # The image defaults to /tmp/kafka-logs inside the container; keep the log on the volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  identity-service:
    <<: *java
    build: ../services/identity-service
    image: moodle/identity-service:dev
    environment:
      <<: *java-env
      DB_URL: jdbc:mysql://mysql:3306/identity
      DB_USERNAME: identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity-dev}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-0123456789abcdef0123456789}
      INTERNAL_CLIENT_GATEWAY_SECRET: ${INTERNAL_CLIENT_GATEWAY_SECRET:-gateway-dev-secret}
      INTERNAL_CLIENT_ACADEMIC_SECRET: ${INTERNAL_CLIENT_ACADEMIC_SECRET:-academic-dev-secret}
      INTERNAL_CLIENT_ASSESSMENT_SECRET: ${INTERNAL_CLIENT_ASSESSMENT_SECRET:-assessment-dev-secret}
      INTERNAL_CLIENT_MESSAGING_SECRET: ${INTERNAL_CLIENT_MESSAGING_SECRET:-messaging-dev-secret}
      INTERNAL_CLIENT_PROGRESS_SECRET: ${INTERNAL_CLIENT_PROGRESS_SECRET:-progress-dev-secret}
      INTERNAL_JWT_PRIVATE_KEY: ${INTERNAL_JWT_PRIVATE_KEY:-}
      INTERNAL_JWT_PUBLIC_KEY: ${INTERNAL_JWT_PUBLIC_KEY:-}
      # Plain HTTP locally: no Secure/__Host- cookies. true behind HTTPS.
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      # Addresses Tomcat accepts as proxies when reading X-Forwarded-For (sign-in rate limits and
      # session records go by client address). Only the gateway reaches this service, and it
      # already sanitises the chain. Local default: trust it entirely, so tests can simulate many
      # clients from one machine. In production leave this unset: the default (private networks
      # only) then trusts just the gateway.
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: ${IDENTITY_TRUSTED_PROXIES:-.*}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      OAUTH_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-unset}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-unset}
      MAIL_USERNAME: ${MAIL_USERNAME:-unset@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-unset}
      PROFILE_PICTURES_DIR: /app/profile-pictures
    volumes:
      - identity-profile-pictures:/app/profile-pictures
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  academic-service:
    <<: *java
    build: ../services/academic-service
    image: moodle/academic-service:dev
    environment:
      <<: *java-env
      DB_URL: jdbc:mysql://mysql:3306/academic
      DB_USERNAME: academic
      DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-academic-dev}
      IDENTITY_URL: http://identity-service:8083
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_ACADEMIC_SECRET:-academic-dev-secret}
      PROGRESS_URL: http://progress-service:8085
      ASSESSMENT_URL: http://assessment-service:8084
    volumes:
      - academic-uploads:/app/uploads
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  messaging-service:
    <<: *java
    build: ../services/messaging-service
    image: moodle/messaging-service:dev
    environment:
      <<: *java-env
      DB_URL: jdbc:mysql://mysql:3306/messaging
      DB_USERNAME: messaging
      DB_PASSWORD: ${MESSAGING_DB_PASSWORD:-messaging-dev}
      IDENTITY_URL: http://identity-service:8083
      ACADEMIC_URL: http://academic-service:8081
      ASSESSMENT_URL: http://assessment-service:8084
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_MESSAGING_SECRET:-messaging-dev-secret}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      academic-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  assessment-service:
    <<: *java
    build: ../services/assessment-service
    image: moodle/assessment-service:dev
    environment:
      <<: *java-env
      DB_URL: jdbc:mysql://mysql:3306/assessment
      DB_USERNAME: assessment
      DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessment-dev}
      IDENTITY_URL: http://identity-service:8083
      ACADEMIC_URL: http://academic-service:8081
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_ASSESSMENT_SECRET:-assessment-dev-secret}
      UPLOADS_DIR: /app/uploads
    volumes:
      - assessment-uploads:/app/uploads
    depends_on:
      academic-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  progress-service:
    <<: *java
    build: ../services/progress-service
    image: moodle/progress-service:dev
    environment:
      <<: *java-env
      DB_URL: jdbc:mysql://mysql:3306/progress
      DB_USERNAME: progress
      DB_PASSWORD: ${PROGRESS_DB_PASSWORD:-progress-dev}
      IDENTITY_URL: http://identity-service:8083
      ACADEMIC_URL: http://academic-service:8081
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_PROGRESS_SECRET:-progress-dev-secret}
    depends_on:
      academic-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  gateway:
    <<: *java
    build: ../edge/gateway
    image: moodle/gateway:dev
    environment:
      <<: *java-env
      IDENTITY_URL: http://identity-service:8083
      ACADEMIC_URL: http://academic-service:8081
      MESSAGING_URL: http://messaging-service:8082
      PROGRESS_URL: http://progress-service:8085
      ASSESSMENT_URL: http://assessment-service:8084
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_GATEWAY_SECRET:-gateway-dev-secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mdl_session}
      # Who may report a client address in X-Forwarded-For. Local default: anyone (the only client
      # is this machine, and tests simulate many users this way). In production, only the reverse
      # proxy in front of the gateway (see .env.example).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-.*}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      progress-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

volumes:
  assessment-uploads:
  identity-profile-pictures:
  mysql-data:
  kafka-data:
  academic-uploads:
