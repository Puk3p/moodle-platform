spring.application.name=identity-service
server.port=${PORT:8083}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Own database ─────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ── Behind the gateway ───────────────────────────────
# The client address (rate limits, session records) comes from X-Forwarded-For, read by Tomcat's
# RemoteIpValve, which only believes hops from trusted proxies (server.tomcat.remoteip.*).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# ── Session cookies ──────────────────────────────────
# Authentication is an HttpOnly, Secure, SameSite=Strict, __Host- prefixed cookie (SessionCookies).
# Only set APP_SESSION_COOKIE_SECURE=false for local HTTP development.
app.session.cookie-secure=${APP_SESSION_COOKIE_SECURE:true}
# The servlet HTTP session exists only to carry OAuth2 state across the provider redirect.
# Lax (not Strict) because the provider's redirect back to us is a cross-site navigation.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m
server.servlet.session.tracking-modes=cookie

app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# The pre-2FA challenge token (HS256, minutes).
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=moodlev2

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/google

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri=${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/facebook
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,email,first_name,last_name
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# Profile pictures, the only uploads here: 2 MB images (ProfilePictureUploadLimitFilter).
app.profile-pictures.dir=${PROFILE_PICTURES_DIR:profile-pictures}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Internal tokens (/internal/**, gateway and services only) ─
# RS256 key pair (PEM). Leave empty to have one generated on the first start and kept in this
# service's database (signing_keys), the same for every restart and instance.
security.internal-jwt.issuer=${INTERNAL_JWT_ISSUER:moodle-identity}
security.internal-jwt.private-key=${INTERNAL_JWT_PRIVATE_KEY:}
security.internal-jwt.public-key=${INTERNAL_JWT_PUBLIC_KEY:}
# Services allowed to get tokens (client-credentials grant). A blank secret disables the client.
app.internal.clients.gateway=${INTERNAL_CLIENT_GATEWAY_SECRET:}
app.internal.clients.academic-service=${INTERNAL_CLIENT_ACADEMIC_SECRET:}
app.internal.clients.assessment-service=${INTERNAL_CLIENT_ASSESSMENT_SECRET:}
app.internal.clients.messaging-service=${INTERNAL_CLIENT_MESSAGING_SECRET:}
app.internal.clients.progress-service=${INTERNAL_CLIENT_PROGRESS_SECRET:}

# ── Events to other services (Kafka) ─────────────────
# Through Spring Modulith's event publication registry (the transactional outbox, table
# EVENT_PUBLICATION); see EventExternalizationConfig.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.max.block.ms=2000
spring.modulith.events.externalization.enabled=${EVENTS_EXTERNALIZATION_ENABLED:true}
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
app.kafka.partitions=${KAFKA_PARTITIONS:3}

# ── Actuator ─────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# The mail indicator would open an SMTP connection on every health poll.
management.health.mail.enabled=false
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
