spring.application.name=progress-service
server.port=${PORT:8085}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Own database ─────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ── Core (users, courses, membership) ────────────────
app.core.url=${CORE_URL:http://localhost:8080}
app.core.timeout=2s
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.core.url}/internal/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${INTERNAL_JWT_ISSUER:moodle-core}
spring.security.oauth2.resourceserver.jwt.audiences=moodle-internal
spring.security.oauth2.client.registration.core.client-id=${INTERNAL_CLIENT_ID:progress-service}
spring.security.oauth2.client.registration.core.client-secret=${INTERNAL_CLIENT_SECRET:}
spring.security.oauth2.client.registration.core.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.core.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.core.token-uri=${app.core.url}/internal/oauth2/token

resilience4j.retry.instances.core.max-attempts=2
resilience4j.retry.instances.core.wait-duration=200ms
resilience4j.retry.instances.core.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.core.sliding-window-size=20
resilience4j.circuitbreaker.instances.core.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.core.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.core.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.core.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.core.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# ── Kafka (deadlines, deleted accounts) ──────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
