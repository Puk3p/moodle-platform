spring.application.name=messaging-service
server.port=${PORT:8082}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Own database ─────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ── Other services: identity-service (accounts, tokens), academic-service (courses) ──
app.identity.url=${IDENTITY_URL:http://localhost:8083}
app.academic.url=${ACADEMIC_URL:http://localhost:8081}
app.clients.timeout=2s
# Quiz locks come from assessment-service.
app.assessment.url=${ASSESSMENT_URL:http://localhost:8084}
# Inbound tokens: signed by identity-service, for the internal audience.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.identity.url}/internal/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${INTERNAL_JWT_ISSUER:moodle-identity}
spring.security.oauth2.resourceserver.jwt.audiences=moodle-internal
# Outbound tokens: client-credentials grant at identity-service's token endpoint.
spring.security.oauth2.client.registration.identity.client-id=${INTERNAL_CLIENT_ID:messaging-service}
spring.security.oauth2.client.registration.identity.client-secret=${INTERNAL_CLIENT_SECRET:}
spring.security.oauth2.client.registration.identity.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.identity.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.identity.token-uri=${app.identity.url}/internal/oauth2/token

# Calls to other services: one retry, then each one's circuit breaker opens after mostly-failing
# calls.
resilience4j.retry.instances.academic.max-attempts=2
resilience4j.retry.instances.academic.wait-duration=200ms
resilience4j.retry.instances.academic.retry-exception-predicate=moodlev2.messaging.clients.RetryableCallFailure
resilience4j.circuitbreaker.instances.academic.sliding-window-size=20
resilience4j.circuitbreaker.instances.academic.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.academic.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.academic.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.academic.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.academic.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.identity.max-attempts=2
resilience4j.retry.instances.identity.wait-duration=200ms
resilience4j.retry.instances.identity.retry-exception-predicate=moodlev2.messaging.clients.RetryableCallFailure
resilience4j.circuitbreaker.instances.identity.sliding-window-size=20
resilience4j.circuitbreaker.instances.identity.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.identity.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.identity.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.identity.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.identity.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.assessment.max-attempts=2
resilience4j.retry.instances.assessment.wait-duration=200ms
resilience4j.retry.instances.assessment.retry-exception-predicate=moodlev2.messaging.clients.RetryableCallFailure
resilience4j.circuitbreaker.instances.assessment.sliding-window-size=20
resilience4j.circuitbreaker.instances.assessment.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.assessment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.assessment.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.assessment.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.assessment.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# ── Kafka (other services' events) ───────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Live updates (socket close, chat lock) must reach every instance: a consumer group each.
app.kafka.live-group=${spring.application.name}-live-${random.uuid}

# ── WebSocket / CORS (origins the SPA is served from) ─
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
