spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection pool (HikariCP) ───────────────────────
# Sized for a single instance serving a few hundred concurrent users. A pool of ~20 keeps the
# database from being overwhelmed while leaving headroom; raise only alongside DB capacity.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
# SQL logging is disabled by default; it is noisy and can leak data/parameters into logs.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ── Server / scalability ─────────────────────────────
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
# Honour X-Forwarded-* headers when running behind a reverse proxy (TLS termination, real client
# IP). "native" = Tomcat's RemoteIpValve, which reads X-Forwarded-For from the right and only
# trusts hops from internal proxies (nginx on localhost), so a client cannot fake its address by
# sending its own X-Forwarded-For. ("framework" took the left-most, client-controlled entry.)
# Set to "none" if the app is ever exposed directly.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.error.include-message=never
server.error.include-stacktrace=never

# ── Session cookies ──────────────────────────────────
# Authentication is an HttpOnly, Secure, SameSite=Strict, __Host- prefixed cookie (SessionCookies).
# Only set APP_SESSION_COOKIE_SECURE=false for local HTTP development in a browser that refuses
# Secure cookies on http://localhost.
app.session.cookie-secure=${APP_SESSION_COOKIE_SECURE:true}
# The servlet HTTP session exists only to carry OAuth2 state across the provider redirect.
# Lax (not Strict) because the provider's redirect back to us is a cross-site navigation.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m
# Never put the session id in URLs (;jsessionid=...), where it leaks into logs and Referer.
server.servlet.session.tracking-modes=cookie

# ── API docs ─────────────────────────────────────────
# Off unless explicitly enabled (e.g. SPRINGDOC_ENABLED=true locally); admin-only even then.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# ── Actuator (least-privilege exposure) ──────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# The mail health indicator opens a real SMTP connection on every /actuator/health poll.
# Under a monitor polling every few seconds that becomes a sustained auth storm against the
# SMTP provider (and gets the host's IP throttled). Liveness of the API does not depend on mail.
management.health.mail.enabled=false

# ── Logging ──────────────────────────────────────────
# Spring Security at DEBUG logs the full filter chain for every request. That is a large
# volume increase and an information-disclosure surface in production, so it is pinned to
# INFO here. Override per-environment only when actively debugging an auth problem.
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

# ── Application URLs / CORS ──────────────────────────
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=moodlev2

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/google

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri=${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/facebook
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,email,first_name,last_name
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.jackson.serialization.write-dates-as-timestamps=false

# ── Events to other services (Kafka) ─────────────────
# Cross-service events go through Spring Modulith's event publication registry (the transactional
# outbox, table EVENT_PUBLICATION, created by Flyway) and then to Kafka; see
# EventExternalizationConfig. Values are JSON bytes, keys the id the events are ordered by.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
# Fail fast when Kafka is unreachable; the publication stays in EVENT_PUBLICATION and is resent.
spring.kafka.producer.properties.max.block.ms=2000
# Off only for running this app alone without Kafka; events are then kept in-process only.
spring.modulith.events.externalization.enabled=${EVENTS_EXTERNALIZATION_ENABLED:true}
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
app.kafka.partitions=${KAFKA_PARTITIONS:3}
