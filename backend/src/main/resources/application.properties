spring.application.name=academic-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection pool (HikariCP) ───────────────────────
# Sized for a single instance serving a few hundred concurrent users. A pool of ~20 keeps the
# database from being overwhelmed while leaving headroom; raise only alongside DB capacity.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
# SQL logging is disabled by default; it is noisy and can leak data/parameters into logs.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ── Server / scalability ─────────────────────────────
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
# Honour X-Forwarded-* headers when running behind a reverse proxy (TLS termination, real client
# IP). "native" = Tomcat's RemoteIpValve, which reads X-Forwarded-For from the right and only
# trusts hops from internal proxies (nginx on localhost), so a client cannot fake its address by
# sending its own X-Forwarded-For. ("framework" took the left-most, client-controlled entry.)
# Set to "none" if the app is ever exposed directly.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.error.include-message=never
server.error.include-stacktrace=never

# ── API docs ─────────────────────────────────────────
# Off unless explicitly enabled (e.g. SPRINGDOC_ENABLED=true locally); admin-only even then.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# ── Actuator (least-privilege exposure) ──────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ── Logging ──────────────────────────────────────────
# Spring Security at DEBUG logs the full filter chain for every request. That is a large
# volume increase and an information-disclosure surface in production, so it is pinned to
# INFO here. Override per-environment only when actively debugging an auth problem.
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jackson.serialization.write-dates-as-timestamps=false

# ── Events (Kafka) ───────────────────────────────────
# Outbound through Spring Modulith's event publication registry (the transactional outbox, table
# EVENT_PUBLICATION, created by Flyway), then to Kafka; see EventExternalizationConfig. Values are
# JSON bytes, keys the id the events are ordered by. Inbound: identity-service's account events
# (IdentityEventListeners), as JSON strings.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
# Fail fast when Kafka is unreachable; the publication stays in EVENT_PUBLICATION and is resent.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Off only for running this app alone without Kafka; events are then kept in-process only.
spring.modulith.events.externalization.enabled=${EVENTS_EXTERNALIZATION_ENABLED:true}
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
app.kafka.partitions=${KAFKA_PARTITIONS:3}

# ── Tokens (identity-service issues them all) ────────
# Inbound: the gateway's user tokens and other services' service tokens, checked against
# identity-service's public keys.
app.services.identity.url=${IDENTITY_URL:http://localhost:8083}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.services.identity.url}/internal/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${INTERNAL_JWT_ISSUER:moodle-identity}
spring.security.oauth2.resourceserver.jwt.audiences=moodle-internal
# Outbound: this service's own client-credentials token for the others' internal APIs.
spring.security.oauth2.client.registration.identity.client-id=${INTERNAL_CLIENT_ID:academic-service}
spring.security.oauth2.client.registration.identity.client-secret=${INTERNAL_CLIENT_SECRET:}
spring.security.oauth2.client.registration.identity.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.identity.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.identity.token-uri=${app.services.identity.url}/internal/oauth2/token

# ── Other services this one calls ────────────────────
app.services.progress.url=${PROGRESS_URL:http://localhost:8085}
app.services.assessment.url=${ASSESSMENT_URL:http://localhost:8084}

# The directory (identity-service) is needed by almost every page: one retry, then fail fast.
resilience4j.retry.instances.identity.max-attempts=2
resilience4j.retry.instances.identity.wait-duration=200ms
resilience4j.retry.instances.identity.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.identity.sliding-window-size=20
resilience4j.circuitbreaker.instances.identity.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.identity.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.identity.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.identity.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.identity.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
